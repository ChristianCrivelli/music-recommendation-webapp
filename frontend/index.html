<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Catalog — Album Recommendations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #9CB080;
    --paper-deep: #7fa068;
    --card: #F8FAF3;
    --card-line: #DCE6D1;
    --ink: #273338;
    --ink-soft: #52625c;
    --stamp: #618764;
    --stamp-soft: rgba(97,135,100,0.12);
    --tab: #2B5748;
    --tab-tint: #E8F1E3;
    --accent: #618764;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 3px 3px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    padding: 0 20px 80px;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  header {
    padding: 56px 0 28px;
    text-align: center;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(34px, 6vw, 56px);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  header p {
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ── Search drawer ─────────────────────────────────────────────── */

  .drawer {
    position: relative;
    background: var(--tab);
    border-radius: 10px 10px 4px 4px;
    padding: 6px 6px 0;
    box-shadow: 0 14px 26px -14px rgba(0,0,0,0.45);
  }

  .drawer-label {
    color: var(--tab-tint);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 8px 14px 10px;
    opacity: 0.75;
  }

  .drawer-face {
    background: var(--card);
    border-radius: 6px 6px 2px 2px;
    padding: 18px;
    position: relative;
  }

  .search-row {
    display: flex;
    gap: 10px;
    position: relative;
  }

  input#search {
    flex: 1;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    padding: 12px 14px;
    border: 1.5px solid var(--card-line);
    background: #fff;
    color: var(--ink);
    border-radius: 4px;
    outline: none;
  }
  input#search:focus { border-color: var(--accent); }

  button#go {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--stamp);
    color: #F8FAF3;
    border: none;
    padding: 0 22px;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button#go:hover { transform: translateY(-1px); }
  button#go:active { transform: translateY(0); }

  .suggest {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 96px;
    background: #fff;
    border: 1px solid var(--card-line);
    border-radius: 4px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 5;
    box-shadow: 0 10px 20px -8px rgba(0,0,0,0.25);
    display: none;
  }
  .suggest.open { display: block; }
  .suggest div {
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid #eaf0e3;
  }
  .suggest div:last-child { border-bottom: none; }
  .suggest div:hover { background: var(--stamp-soft); }

  .hint {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 10px;
    letter-spacing: 0.02em;
  }

  /* ── Matched album: shown right under the search bar ─────────── */

  .matched {
    display: none;
    margin-top: 22px;
    background: var(--card);
    border-radius: 6px;
    padding: 16px;
    box-shadow: 0 10px 22px -14px rgba(0,0,0,0.5), 0 1px 0 rgba(0,0,0,0.05);
    align-items: center;
    gap: 16px;
  }
  .matched.open { display: flex; }
  .matched .cover {
    width: 84px;
    height: 84px;
    flex: none;
    margin: 0;
  }
  .matched .matched-info h3 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .matched .matched-info .artist {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .matched .matched-info .meta-row {
    margin-bottom: 0;
  }
  .matched .eyebrow-small {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.7;
    margin-bottom: 2px;
  }

  /* ── Tabs ──────────────────────────────────────────────────────── */

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .tab-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--tab);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    opacity: 0.65;
  }
  .tab-btn.active {
    background: var(--tab);
    color: #F8FAF3;
    opacity: 1;
  }

  .recent-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 8px 18px -14px rgba(0,0,0,0.4);
  }
  .recent-row .cover {
    width: 56px;
    height: 56px;
    flex: none;
    margin: 0;
  }
  .recent-row .recent-info {
    flex: 1;
    min-width: 0;
  }
  .recent-row h4 {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recent-row .artist {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .recent-badge {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 12px;
    white-space: nowrap;
    flex: none;
  }
  .recent-badge.added {
    color: var(--stamp);
    border: 1px solid var(--stamp);
  }
  .recent-badge.edited {
    color: var(--tab);
    border: 1px solid var(--tab);
  }
  .recent-date {
    font-size: 10px;
    color: var(--ink-soft);
    white-space: nowrap;
    flex: none;
  }

  /* ── Stats page ────────────────────────────────────────────────── */

  .stats-overview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--card);
    border-radius: 6px;
    padding: 14px 16px;
    text-align: center;
    box-shadow: 0 8px 18px -14px rgba(0,0,0,0.4);
  }
  .stat-card .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
  }
  .stat-card .stat-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .stat-card.callout .stat-value { color: var(--stamp); }

  .stats-section {
    margin-bottom: 32px;
  }
  .stats-section h3 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 17px;
    margin: 0 0 12px;
  }
  .stats-columns {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }

  .rank-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--card-line);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-num {
    font-size: 11px;
    color: var(--ink-soft);
    width: 18px;
    flex: none;
  }
  .rank-name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rank-meta {
    font-size: 11px;
    color: var(--ink-soft);
    flex: none;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .bar-label {
    width: 110px;
    flex: none;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    flex: 1;
    height: 14px;
    background: var(--tab-tint);
    border-radius: 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 8px;
  }
  .bar-value {
    width: 34px;
    flex: none;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }

  .histogram {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 120px;
    padding-top: 10px;
  }
  .hist-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .hist-bar {
    width: 100%;
    background: var(--tab);
    border-radius: 3px 3px 0 0;
    min-height: 2px;
  }
  .hist-label {
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  /* ── Status / empty states ────────────────────────────────────── */

  .status {
    margin-top: 40px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .status.error { color: var(--stamp); }

  /* ── Results: fanned index cards ──────────────────────────────── */

  .results-head {
    margin: 46px 0 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .results-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 20px;
    margin: 0;
  }
  .results-head span {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }

  .card {
    position: relative;
    background: var(--card);
    border-radius: 3px;
    padding: 20px 18px 18px;
    box-shadow: 0 10px 22px -14px rgba(0,0,0,0.5), 0 1px 0 rgba(0,0,0,0.05);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      var(--card-line) 28px
    );
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.45s ease forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .card::before {
    content: '';
    position: absolute;
    top: 14px; left: 14px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
  }

  .card-index {
    position: absolute;
    top: 16px; left: 36px;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }

  .stamp {
    position: absolute;
    top: 10px; right: 10px;
    border: 2px solid var(--stamp);
    color: var(--stamp);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    transform: rotate(6deg);
    opacity: 0.92;
    background: rgba(248,250,243,0.9);
    white-space: nowrap;
    z-index: 2;
  }

  .cover {
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 30px 0 12px;
    border-radius: 2px;
    overflow: hidden;
    background: var(--tab);
    position: relative;
    box-shadow: 0 6px 14px -8px rgba(0,0,0,0.4);
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cover.placeholder svg { width: 46%; height: 46%; opacity: 0.55; }

  .card h3 {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 2px;
    line-height: 1.25;
  }

  .card .artist {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .tag {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--tab);
    border: 1px solid var(--tab);
    padding: 2px 7px;
    border-radius: 20px;
    opacity: 0.85;
  }

  footer {
    text-align: center;
    margin-top: 70px;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.8;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">A Personal Library, Cross&#8209;Referenced</div>
      <h1>The Catalog</h1>
      <p>Type in an album you love.</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="tabSearch" data-tab="search">Search</button>
      <button class="tab-btn" id="tabRecent" data-tab="recent">Recently Added</button>
      <button class="tab-btn" id="tabStats" data-tab="stats">Stats</button>
    </div>

    <div id="searchPane">
    <div class="drawer">
      <div class="drawer-label">Search by Title</div>
      <div class="drawer-face">
        <div class="search-row">
          <input id="search" type="text" placeholder="e.g. Nah, I'm Good by BigBallerChris" autocomplete="off" />
          <button id="go">Find similar albums!</button>
          <div id="suggest" class="suggest"></div>
        </div>
      </div>
    </div>

    <div id="matched" class="matched">
      <div class="cover" id="matchedCover"></div>
      <div class="matched-info">
        <div class="eyebrow-small">In your library</div>
        <h3 id="matchedTitle"></h3>
        <div class="artist" id="matchedArtist"></div>
        <div class="meta-row"><span id="matchedYear"></span><span id="matchedRating"></span></div>
      </div>
    </div>

    <div id="status" class="status" style="display:none;"></div>

    <div id="resultsSection" style="display:none;">
      <div class="results-head">
        <h2 id="resultsTitle">Cross-references for &ndash;</h2>
        <span id="resultsCount"></span>
      </div>
      <div class="cards" id="cards"></div>
    </div>
    </div>

    <div id="recentPane" style="display:none;">
      <div id="recentStatus" class="status"></div>
      <div id="recentList"></div>
    </div>

    <div id="statsPane" style="display:none;">
      <div id="statsStatus" class="status"></div>
      <div id="statsContent"></div>
    </div>

    <footer>Recommendations pulled live from a hand-curated album library.</footer>
  </div>

<script>
  // ── Point this at your deployed FastAPI backend ──────────────────────────
  // This is the #1 thing to set after deploying — without it, the search box
  // looks "broken" (silently empty) because it's still trying to reach your
  // local machine instead of your live Render URL.
  //
  //   const API_BASE = "https://your-backend.onrender.com";
  //
  const API_BASE = window.ALBUM_API_BASE || "https://album-recs-api.onrender.com";

  const searchInput = document.getElementById('search');
  const suggestBox = document.getElementById('suggest');
  const goBtn = document.getElementById('go');
  const statusEl = document.getElementById('status');
  const resultsSection = document.getElementById('resultsSection');
  const resultsTitle = document.getElementById('resultsTitle');
  const resultsCount = document.getElementById('resultsCount');
  const cardsEl = document.getElementById('cards');
  const matchedEl = document.getElementById('matched');
  const matchedCover = document.getElementById('matchedCover');
  const matchedTitle = document.getElementById('matchedTitle');
  const matchedArtist = document.getElementById('matchedArtist');
  const matchedYear = document.getElementById('matchedYear');
  const matchedRating = document.getElementById('matchedRating');

  const tabSearch = document.getElementById('tabSearch');
  const tabRecent = document.getElementById('tabRecent');
  const tabStats = document.getElementById('tabStats');
  const searchPane = document.getElementById('searchPane');
  const recentPane = document.getElementById('recentPane');
  const statsPane = document.getElementById('statsPane');
  const recentStatus = document.getElementById('recentStatus');
  const recentList = document.getElementById('recentList');
  const statsStatus = document.getElementById('statsStatus');
  const statsContent = document.getElementById('statsContent');
  let recentLoaded = false;
  let statsLoaded = false;

  let allTitles = [];
  let titlesLoaded = false;

  // Render's free tier spins down after 15 min idle — the first request can
  // take 30-60s to wake it back up. Retry a few times with backoff instead
  // of failing silently on the first attempt.
  async function loadTitles(attempt = 1) {
    if (API_BASE.includes('your-backend')) {
      setStatus('Backend URL not set yet — edit API_BASE at the top of the <script> tag in index.html.', true);
      return;
    }
    if (attempt === 1) setStatus('Waking up the library…');
    try {
      const res = await fetch(`${API_BASE}/api/albums`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allTitles = data.titles || [];
      titlesLoaded = true;
      setStatus('');
    } catch (e) {
      console.error('Could not load album list', e);
      if (attempt < 4) {
        setTimeout(() => loadTitles(attempt + 1), attempt * 4000);
      } else {
        setStatus('Could not reach the backend. Double-check API_BASE in index.html and that your Render service is deployed.', true);
      }
    }
  }

  function showSuggestions(query) {
    const q = query.trim().toLowerCase();
    if (!q) { suggestBox.classList.remove('open'); return; }
    const matches = allTitles.filter(t => t.toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length) { suggestBox.classList.remove('open'); return; }
    suggestBox.innerHTML = matches.map(t => `<div data-title="${t.replace(/"/g,'&quot;')}">${t}</div>`).join('');
    suggestBox.classList.add('open');
  }

  suggestBox.addEventListener('click', (e) => {
    const t = e.target.getAttribute('data-title');
    if (t) {
      searchInput.value = t;
      suggestBox.classList.remove('open');
      runSearch();
    }
  });

  searchInput.addEventListener('input', () => showSuggestions(searchInput.value));
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-row')) suggestBox.classList.remove('open');
  });
  goBtn.addEventListener('click', runSearch);

  function setStatus(msg, isError = false) {
    statusEl.style.display = msg ? 'block' : 'none';
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', isError);
  }

  async function runSearch() {
    const title = searchInput.value.trim();
    if (!title) return;
    suggestBox.classList.remove('open');
    resultsSection.style.display = 'none';
    matchedEl.classList.remove('open');
    setStatus('Pulling the card for "' + title + '" …');

    try {
      const res = await fetch(`${API_BASE}/api/recommend?title=${encodeURIComponent(title)}&n=6`);
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();

      if (data.matched_album) {
        renderMatchedAlbum(data.matched_album);
      }

      if (!data.results || !data.results.length) {
        if (data.suggestions && data.suggestions.length) {
          setStatus(`Not in the library yet. Did you mean: ${data.suggestions.join(', ')}?`, true);
        } else if (!data.matched_album) {
          setStatus(`That album isn't in the database.`, true);
        } else {
          setStatus('');
        }
        return;
      }

      setStatus('');
      renderResults(data);
    } catch (e) {
      console.error(e);
      setStatus('Could not reach the catalog right now — try again shortly.', true);
    }
  }

  function renderMatchedAlbum(album) {
    matchedTitle.textContent = album.title;
    matchedArtist.textContent = album.artist_names || 'Unknown artist';
    matchedYear.textContent = album.release_year || '—';
    matchedRating.textContent = album.rating ? 'My rating: ' + album.rating : '';

    matchedCover.classList.remove('placeholder');
    if (album.cover_url) {
      matchedCover.innerHTML = `<img src="${album.cover_url}" alt="${escapeHtml(album.title)} cover" loading="lazy" onerror="this.parentElement.classList.add('placeholder'); this.remove();" />`;
    } else {
      matchedCover.classList.add('placeholder');
      matchedCover.innerHTML = sleeveSvg();
    }

    matchedEl.classList.add('open');
  }

  function renderResults(data) {
    resultsTitle.textContent = `Cross-references for "${data.matched_title}"`;
    resultsCount.textContent = `${data.results.length} matches`;
    cardsEl.innerHTML = data.results.map((r, i) => `
      <div class="card" style="animation-delay:${i * 60}ms">
        <div class="card-index">No. ${String(i + 1).padStart(2, '0')}</div>
        <div class="cover ${r.cover_url ? '' : 'placeholder'}">
          ${r.cover_url ? `<img src="${r.cover_url}" alt="${escapeHtml(r.title)} cover" loading="lazy" onerror="this.parentElement.classList.add('placeholder'); this.remove();" />` : sleeveSvg()}
          <div class="stamp">${Math.round(r.similarity * 100)}% match</div>
        </div>
        <h3>${escapeHtml(r.title)}</h3>
        <div class="artist">${escapeHtml(r.artist_names || 'Unknown artist')}</div>
        <div class="meta-row">
          <span>${r.release_year || '—'}</span>
          <span>${r.rating ? 'My rating: ' + r.rating : ''}</span>
        </div>
        <div class="tags">
          ${(r.tags || []).slice(0, 5).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
    `).join('');
    resultsSection.style.display = 'block';
  }

  function sleeveSvg() {
    return `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="42" fill="#273338" opacity="0.9"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#9CB080" stroke-width="1" opacity="0.6"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#9CB080" stroke-width="0.6" opacity="0.45"/>
      <circle cx="50" cy="50" r="18" fill="none" stroke="#9CB080" stroke-width="0.6" opacity="0.45"/>
      <circle cx="50" cy="50" r="7" fill="#F8FAF3"/>
      <circle cx="50" cy="50" r="2" fill="#273338"/>
    </svg>`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function switchTab(tab) {
    tabSearch.classList.toggle('active', tab === 'search');
    tabRecent.classList.toggle('active', tab === 'recent');
    tabStats.classList.toggle('active', tab === 'stats');
    searchPane.style.display = tab === 'search' ? 'block' : 'none';
    recentPane.style.display = tab === 'recent' ? 'block' : 'none';
    statsPane.style.display = tab === 'stats' ? 'block' : 'none';
    if (tab === 'recent' && !recentLoaded) loadRecent();
    if (tab === 'stats' && !statsLoaded) loadStats();
  }
  tabSearch.addEventListener('click', () => switchTab('search'));
  tabRecent.addEventListener('click', () => switchTab('recent'));
  tabStats.addEventListener('click', () => switchTab('stats'));

  function setRecentStatus(msg, isError = false) {
    recentStatus.style.display = msg ? 'block' : 'none';
    recentStatus.textContent = msg || '';
    recentStatus.classList.toggle('error', isError);
  }

  async function loadRecent(attempt = 1) {
    if (API_BASE.includes('your-backend')) {
      setRecentStatus('Backend URL not set yet — edit API_BASE at the top of the <script> tag in index.html.', true);
      return;
    }
    if (attempt === 1) setRecentStatus('Pulling the last two weeks…');
    try {
      const res = await fetch(`${API_BASE}/api/recent`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      recentLoaded = true;
      if (!data.albums || !data.albums.length) {
        setRecentStatus('Nothing added or edited in the last 2 weeks.');
        return;
      }
      setRecentStatus('');
      renderRecent(data.albums);
    } catch (e) {
      console.error('Could not load recent albums', e);
      if (attempt < 4) {
        setTimeout(() => loadRecent(attempt + 1), attempt * 4000);
      } else {
        setRecentStatus('Could not reach the backend. Try again shortly.', true);
      }
    }
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function renderRecent(albums) {
    recentList.innerHTML = albums.map(a => `
      <div class="recent-row">
        <div class="cover ${a.cover_url ? '' : 'placeholder'}">
          ${a.cover_url ? `<img src="${a.cover_url}" alt="${escapeHtml(a.title)} cover" loading="lazy" onerror="this.parentElement.classList.add('placeholder'); this.remove();" />` : sleeveSvg()}
        </div>
        <div class="recent-info">
          <h4>${escapeHtml(a.title)}</h4>
          <div class="artist">${escapeHtml(a.artist_names || 'Unknown artist')}${a.rating ? ' · My rating: ' + a.rating : ''}</div>
        </div>
        <span class="recent-badge ${a.edited ? 'edited' : 'added'}">${a.edited ? 'Edited' : 'Added'}</span>
        <span class="recent-date">${formatDate(a.edited ? a.edited_at : a.added_at)}</span>
      </div>
    `).join('');
  }

  function setStatsStatus(msg, isError = false) {
    statsStatus.style.display = msg ? 'block' : 'none';
    statsStatus.textContent = msg || '';
    statsStatus.classList.toggle('error', isError);
  }

  async function loadStats(attempt = 1) {
    if (API_BASE.includes('your-backend')) {
      setStatsStatus('Backend URL not set yet — edit API_BASE at the top of the <script> tag in index.html.', true);
      return;
    }
    if (attempt === 1) setStatsStatus('Crunching the numbers…');
    try {
      const res = await fetch(`${API_BASE}/api/stats`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      statsLoaded = true;
      setStatsStatus('');
      renderStats(data);
    } catch (e) {
      console.error('Could not load stats', e);
      if (attempt < 4) {
        setTimeout(() => loadStats(attempt + 1), attempt * 4000);
      } else {
        setStatsStatus('Could not reach the backend. Try again shortly.', true);
      }
    }
  }

  function barRows(items, labelKey, valueKey, maxValue, valueFormatter) {
    return items.map(item => {
      const val = item[valueKey];
      const pct = maxValue > 0 ? Math.max(4, (val / maxValue) * 100) : 0;
      return `
        <div class="bar-row">
          <div class="bar-label" title="${escapeHtml(item[labelKey])}">${escapeHtml(item[labelKey])}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-value">${valueFormatter ? valueFormatter(val) : val}</div>
        </div>
      `;
    }).join('');
  }

  function renderStats(data) {
    const overview = `
      <div class="stats-overview">
        <div class="stat-card"><div class="stat-value">${data.total_albums}</div><div class="stat-label">Albums</div></div>
        <div class="stat-card"><div class="stat-value">${data.avg_rating ?? '—'}</div><div class="stat-label">Avg Rating</div></div>
        <div class="stat-card"><div class="stat-value">${data.unique_artists}</div><div class="stat-label">Artists</div></div>
        <div class="stat-card"><div class="stat-value">${data.unique_tags}</div><div class="stat-label">Genres/Tags</div></div>
        <div class="stat-card callout"><div class="stat-value">${data.untagged_albums}</div><div class="stat-label">Untagged Albums</div></div>
      </div>
    `;

    const albumsSection = `
      <div class="stats-section">
        <h3>Most Loved Albums</h3>
        ${data.most_loved_albums.map((a, i) => `
          <div class="rank-row">
            <span class="rank-num">${i + 1}.</span>
            <span class="rank-name">${escapeHtml(a.title)} — ${escapeHtml(a.artist_names)}</span>
            <span class="rank-meta">${a.rating}/10</span>
          </div>
        `).join('') || '<div class="rank-row"><span class="rank-name">Not enough rated albums yet.</span></div>'}
      </div>
    `;

    const artistsSection = `
      <div class="stats-section">
        <h3>Most Loved Artists</h3>
        ${data.most_loved_artists.map((a, i) => `
          <div class="rank-row">
            <span class="rank-num">${i + 1}.</span>
            <span class="rank-name">${escapeHtml(a.name)}</span>
            <span class="rank-meta">${a.avg_rating}/10 avg · ${a.album_count} album${a.album_count === 1 ? '' : 's'}</span>
          </div>
        `).join('') || '<div class="rank-row"><span class="rank-name">Not enough rated albums yet.</span></div>'}
      </div>
    `;

    const maxQuality = Math.max(...data.top_genres_by_quality.map(g => g.weighted_score), 1);
    const maxFreq = Math.max(...data.top_genres_by_frequency.map(g => g.album_count), 1);
    const genresSection = `
      <div class="stats-section">
        <h3>Genres</h3>
        <div class="stats-columns">
          <div>
            <div class="eyebrow-small" style="margin-bottom:8px;">Highest rated (weighted)</div>
            ${barRows(data.top_genres_by_quality, 'tag', 'weighted_score', maxQuality, v => v.toFixed(1)) || '<div class="rank-row"><span class="rank-name">No tagged, rated albums yet.</span></div>'}
          </div>
          <div>
            <div class="eyebrow-small" style="margin-bottom:8px;">Most common</div>
            ${barRows(data.top_genres_by_frequency, 'tag', 'album_count', maxFreq) || '<div class="rank-row"><span class="rank-name">No tags yet.</span></div>'}
          </div>
        </div>
      </div>
    `;

    const maxHist = Math.max(...data.rating_distribution.map(b => b.count), 1);
    const histogramSection = `
      <div class="stats-section">
        <h3>Rating Distribution</h3>
        <div class="histogram">
          ${Array.from({length: 10}, (_, i) => i + 1).map(r => {
            const bucket = data.rating_distribution.find(b => b.rating === r);
            const count = bucket ? bucket.count : 0;
            const pct = maxHist > 0 ? Math.max(count > 0 ? 4 : 0, (count / maxHist) * 100) : 0;
            return `
              <div class="hist-col">
                <div class="hist-bar" style="height:${pct}%" title="${count} album${count === 1 ? '' : 's'} rated ${r}"></div>
                <div class="hist-label">${r}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    const maxDecade = Math.max(...data.ratings_by_decade.map(d => d.album_count), 1);
    const decadeSection = data.ratings_by_decade.length ? `
      <div class="stats-section">
        <h3>Ratings by Decade</h3>
        ${data.ratings_by_decade.map(d => `
          <div class="bar-row">
            <div class="bar-label">${escapeHtml(d.decade)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4, (d.album_count / maxDecade) * 100)}%"></div></div>
            <div class="bar-value">${d.avg_rating ?? '—'}</div>
          </div>
        `).join('')}
      </div>
    ` : '';

    statsContent.innerHTML = overview + albumsSection + artistsSection + genresSection + histogramSection + decadeSection;
  }

  loadTitles();
</script>
</body>
</html>
